[package]
name = "gateway"
version = "0.1.0"
edition = "2021"
description = "AlfyChat — gateway (Rust)"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
socketioxide = { version = "0.18", features = ["state", "extensions", "v4"] }
socketioxide-redis = "0.4"
socketioxide-core = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
redis = { version = "1", features = ["tokio-comp", "connection-manager", "script"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "chrono"] }
jsonwebtoken = "10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"
regex = "1"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
url = "2"
sha1 = "0.10"
unicode-normalization = "0.1"
bytes = "1"
percent-encoding = "2"
socket2 = "0.5"
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
